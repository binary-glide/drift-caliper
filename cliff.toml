# Changelog generation (BIN-90).
#
# git-cliff 2.13.1, verified live against PyPI on 2026-09-16.
#
# ---------------------------------------------------------------------------
# 🚨 Why this file exists at all, rather than git-cliff's defaults
# ---------------------------------------------------------------------------
#
# Run with the stock configuration, git-cliff reports:
#
#     WARN  5 commit(s) were skipped due to parse error(s)
#     ## [unreleased]
#
# An empty section, and a warning nobody reads in CI. **Every commit in this
# repository fails the default conventional-commit parser**, because the
# subject begins with a gitmoji: `📝 docs: ...` is not `docs: ...`.
#
# A changelog that renders a confident heading over silently dropped content
# is the exact failure mode this library exists to prevent, committed by the
# project's own tooling. The preprocessor below is therefore load-bearing, not
# cosmetic -- and `filter_unconventional = false` is what keeps a
# non-conforming subject visible instead of vanishing.

[changelog]
header = """
# Changelog

All notable changes to `drift-caliper`.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project uses [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

⚠️ **Generated from commit history by [git-cliff](https://git-cliff.org)** --
run `uv run git-cliff -o CHANGELOG.md` before tagging. Narrative release notes
on the [GitHub releases page](https://github.com/binary-glide/drift-caliper/releases)
are written by hand and say *why*; this file is the complete record of *what*.

⚠️ **Pull request numbers below `0.1.0a1` refer to a different repository.**
This history was exported from the private `binary-glide/caliper`, whose
numbering restarted at 1 here -- so `(#75)` is an old-repository reference and
resolves nowhere public, while `(#12)` on a later entry is this repository's.
They are kept verbatim because they are accurate provenance; they are
deliberately **not** hyperlinked, since a link would silently point at the
wrong pull request once the two ranges overlap.

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] -- {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}
"""

footer = """
<!-- generated by git-cliff -->
"""

# Left false so each release body keeps the trailing blank line that
# separates it from the next `##` heading. With trimming on, the last entry of
# one release butts directly against the next version's header.
trim = false

# No `[remote.github]` section, deliberately. git-cliff resolves pull request
# links through the GitHub API, which makes output depend on network access and
# an unauthenticated rate limit -- the same changelog would generate
# differently on a bad day. A release artefact must be reproducible.

[git]
conventional_commits = true

# 🚨 Never drop a commit. A subject that does not parse is reported under
# "Other" below rather than disappearing -- see the header note. Six subjects
# on `trunk` are squash-merge pull request titles carrying a gitmoji but no
# conventional type (BIN-152), and they describe real, shipped changes.
filter_unconventional = false

# Only commits matching a parser appear; `protect_breaking_commits` keeps a
# `!`-marked change visible even if its type is otherwise skipped.
filter_commits = false
protect_breaking_commits = true

split_commits = false
topo_order = false
sort_commits = "newest"

commit_preprocessors = [
  # Strip the leading gitmoji so the conventional parser sees `docs: ...`.
  #
  # ⚠️ Matches a run of leading non-ASCII rather than an enumerated emoji list.
  # An enumeration needs editing every time Gitmoji adds an entry, and its
  # failure mode is a silently skipped commit. `♻️` is two codepoints
  # (U+267B U+FE0F) and both are non-ASCII, so a run is required, not one char.
  { pattern = '^[^\x00-\x7F]+\s*', replace = "" },
  # Dependabot writes the `:arrow_up:` shortcode form instead.
  { pattern = '^:[a-z0-9_+-]+:\s*', replace = "" },
]

# Order matters: the first matching parser wins.
#
# The `<!-- N -->` prefixes set section order in the rendered file -- git-cliff
# groups alphabetically otherwise, which would put "Documentation" above
# "Fixed". The template strips them with `striptags`.
commit_parsers = [
  # Plumbing, not content. Each of these is a pre-squash-merge
  # `Merge pull request #N`, and the commit it merged is already listed.
  { message = "^Merge (pull request|branch|remote-tracking)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  # Internal work is grouped, not hidden. A reader deciding whether to upgrade
  # does not need it above the fold, but this project does not publish a
  # changelog that quietly omits what it did.
  { message = "^test", group = "<!-- 5 -->Internal" },
  { message = "^ci", group = "<!-- 5 -->Internal" },
  { message = "^build", group = "<!-- 5 -->Internal" },
  { message = "^chore", group = "<!-- 5 -->Internal" },
  { message = "^style", group = "<!-- 5 -->Internal" },
  # The catch-all. Anything reaching here is a subject that did not parse --
  # today that is the squash-merge titles of BIN-152. Its presence is the
  # point: an unparsed commit is visible, not lost.
  { message = ".*", group = "<!-- 6 -->Other" },
]
