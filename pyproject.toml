[project]
name = "caliper-ai"
version = "0.1.0.dev0"
description = "Statistical Process Control for LLM-as-a-judge agent quality scores"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Binary Glide" }]
keywords = ["spc", "control-chart", "llm", "drift-detection", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]

# Lower bounds only, deliberately. ADR-001 rejected Frouros partly because its
# upper bounds (numpy<2.2, scipy<1.15) propagate into consumers' dependency
# resolution. Caliper must not do the same thing to its own adopters.
#
# Floors are provisional: they are satisfied by current releases (numpy 2.5.3,
# scipy 1.18.1 as recorded in ADR-001, verified 2026-09-08) but have not been
# tested against the floor itself. Revisit when BIN-84 exercises scipy for real.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  # Domain types are Pydantic BaseModel with ConfigDict(frozen=True), per the
  # house standard and architecture/references/ddd.md. Validation lives in
  # @field_validator on the value object, so no construction path bypasses it.
  "pydantic>=2.13",
]

[project.urls]
Repository = "https://github.com/Binary-Glide/caliper"

[dependency-groups]
# The test stack named in test-patterns/references/python.md. respx and
# pytest-asyncio are absent deliberately: Caliper makes no HTTP calls of its own
# (the judge provider sits behind JudgeProviderPort, faked in tests) and has no
# async surface. Add them with the story that first needs one.
dev = [
  "pytest>=9.1",
  "pytest-bdd>=8.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15",
  "hypothesis>=6.168",
  "factory-boy>=3.3",
  "freezegun>=1.5",
  "dirty-equals>=0.11",
  "mutmut>=3.7",
  "mypy>=2.3",
  "ty>=0.0.79",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caliper"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/bdd"]
addopts = "--strict-markers --strict-config -ra"
# BDD feature files live outside the step-definition directories.
bdd_features_base_dir = "tests/bdd/features"
markers = [
  "unit: fast, isolated tests",
  "integration: tests requiring real infrastructure",
  "slow: tests taking more than 1 second",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/unit/"
runner = "uv run pytest tests/unit/ -x -q"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
# ruff >=0.16 lints and formats Python code blocks inside markdown. ADRs and the
# domain model are ratified records -- a formatter must not silently rewrite
# them, and an illustrative snippet is not required to be import-sorted. Ruff
# owns Python source here; prose is out of its scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "C4",        # flake8-comprehensions
  "RUF",       # ruff-specific
  "D",         # pydocstyle -- docstrings are a stated project standard
]
ignore = [
  "D107",  # __init__ docstring; covered by the class docstring
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Type checking runs twice, on purpose.
#
# `ty` is the house Astral toolchain alongside uv and ruff, and it is fast
# enough to run on every save. It is the first gate.
#
# `mypy --strict` stays as the second gate because Caliper ships `py.typed`:
# its annotations are a public contract that consumers check against mypy and
# pyright, not against ty. ty 0.0.79 is 0.0.x beta with no strict mode and no
# equivalent of `disallow_untyped_defs` / `disallow_any_generics` -- the exact
# checks that make BIN-85's "ships with strict type annotations" enforceable
# rather than aspirational. Drop mypy when ty can express that, not before.
#
# ty needs no config here: it infers the target version from requires-python
# and discovers the project from pyproject.toml.
# ---------------------------------------------------------------------------
[tool.mypy]
# Deliberately NOT pinned to the 3.11 floor via `python_version`.
#
# numpy's bundled stubs use PEP 695 `type` statements, which mypy rejects as a
# syntax error whenever the analysis target is below 3.12 -- so `python_version
# = "3.11"` fails on any 3.12+ interpreter the moment numpy is in the
# environment, which is every developer machine and the CI lint job. Reproduced
# on 3.12 and 3.13; passes only on a 3.11 venv, which is the least likely setup
# anyone actually runs.
#
# The 3.11 floor is enforced where it can be enforced honestly: the pytest
# matrix runs the full suite on 3.11, 3.12 and 3.13, so 3.12-only syntax in
# `src` fails the 3.11 job at import. Revisit if numpy's stubs stop requiring
# 3.12+, or if mypy learns to exempt third-party stubs from the target version.
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
follow_untyped_imports = true
