# Action versions verified live against the GitHub releases API on 2026-09-09:
# actions/checkout v7.0.1 (2026-07-20), astral-sh/setup-uv v10.0.1 (2026-08-14).
# setup-uv is pinned to the exact tag: it stopped publishing floating major
# tags after v7.6, so `@v10` does not resolve.
name: CI

on:
  # Manual trigger. Earned twice over:
  #
  #   * a secret added after the last run is not picked up until something
  #     pushes -- setting CODECOV_TOKEN meant re-running an old run by id to
  #     verify the upload, which is not a thing anyone should have to work out;
  #   * a flake or an infrastructure failure should be re-runnable without an
  #     empty commit on a protected branch.
  workflow_dispatch:
  push:
    branches: [trunk]
  pull_request:
  # The full suite, including tests marked `slow`, nightly. Pull requests and
  # pushes run `-m "not slow"` only: the slow tests are the Bernoulli CUSUM's
  # large-baseline and near-cap cells, ~12 minutes locally and roughly twice
  # that on a runner, per Python version. The not-slow run is required to keep
  # every changed source line covered on its own, so Codecov's patch check
  # stays meaningful on pull requests. A scheduled run executes on the default
  # branch only, and GitHub notifies the account that last edited this cron
  # line when it fails -- check the Actions tab if that is not you.
  schedule:
    - cron: "17 3 * * *"

# Keyed by event as well as ref: otherwise a push to trunk while the nightly
# full run is going would cancel it, and the slow tests would never finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top level, inherited by every job that does not
# narrow it further (OpenSSF Scorecard `Token-Permissions`). Without this the
# workflow runs with whatever the repository default grants, which for a public
# repository is read-only today but is a setting rather than a guarantee --
# and a compromised action in a write-scoped job can push to the repository.
#
# Nothing here writes: lint, audit and test all only read the checkout. The
# Codecov upload authenticates with its own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `checkout` writes GITHUB_TOKEN into .git/config by default, where
          # any later step can read it (zizmor `artipacked`). Nothing in this
          # workflow pushes, so there is nothing to keep credentials for.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check --error-on-warning
      - run: uv run mypy

  # Runs the pre-commit hooks against the whole tree (BIN-89).
  #
  # ⚠️ This deliberately overlaps the `lint` job above, which is not an
  # oversight. `lint` is the authoritative four-gate contract named in
  # CLAUDE.md: it runs the tools directly, needs nothing but uv, and fails
  # legibly per tool. This job checks that the *hook configuration* is green,
  # and catches what `lint` cannot see -- trailing whitespace, missing final
  # newlines, mixed line endings, an unparseable YAML, and the zizmor workflow
  # audit -- for the contributor who never ran `pre-commit install`.
  #
  # The overlap costs a few seconds: ruff is ~0.3s and mypy ~2.2s. Keeping
  # both means a broken hook repo cannot take the real gates down with it.
  #
  # The commit-msg hook is not exercised here: it validates one message at a
  # time, and on a pull request the subject that will actually land is the
  # squash title, which is typed on the web and never reaches any hook.
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # No hook-environment cache on purpose: the only managed environment is
      # pre-commit-hooks, which installs in seconds, and caching it would mean
      # pinning another action for no meaningful saving.
      #
      # `--show-diff-on-failure` matters because several hooks fix rather than
      # report -- without it a failure says "files were modified" and not what
      # changed.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `checkout` writes GITHUB_TOKEN into .git/config by default, where
          # any later step can read it (zizmor `artipacked`). Nothing in this
          # workflow pushes, so there is nothing to keep credentials for.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # `uv audit` audits the *lockfile*, so a vulnerable pin is caught
      # whether or not anything is synced -- no install step needed, and no
      # extra dependency for the project to carry (BIN-87).
      #
      # ⚠️ Experimental as of uv 0.11.26: the interface may change without
      # warning, which is what `--preview-features` acknowledges. If it
      # churns or is withdrawn, the fallback is `pip-audit` in its own
      # dependency group. Do not silently drop this job -- replace it.
      - run: uv audit --preview-features audit-command

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # ADR-015 Amendment 1, A1: BLAS/OpenMP thread caps for every test step,
    # parallel or serial. The Linux numpy and scipy wheels each bundle their own
    # pthreads OpenBLAS, and each starts one thread per vCPU -- so four xdist
    # workers on a 4-vCPU runner run up to eight 4-thread pools at once. Measured
    # on CI (runs 36333444223 and 36335148663, AMD EPYC 7763): the parallel
    # not-slow suite took 966-1495 s uncapped, slower than serial, and
    # 262-313 s capped, about 2x faster than serial. Capping costs nothing
    # serially. OPENBLAS_NUM_THREADS is the one today's wheels read;
    # OMP_NUM_THREADS (OpenBLAS's fallback, and any OpenMP build) and
    # MKL_NUM_THREADS (an MKL build) keep the cap correct if a future wheel
    # changes its BLAS. Do not remove these as unexplained.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        # The support window declared in pyproject's requires-python and
        # classifiers. All three are tested; none is a smoke run.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `checkout` writes GITHUB_TOKEN into .git/config by default, where
          # any later step can read it (zizmor `artipacked`). Nothing in this
          # workflow pushes, so there is nothing to keep credentials for.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      # `--cov-report=xml` is added here rather than in pyproject's addopts:
      # locally the terminal report is what anyone reads, and writing a
      # coverage.xml into the working tree on every `uv run pytest` is noise.
      # Pull requests and trunk pushes skip `slow`; the nightly schedule and a
      # manual dispatch run everything. Separate steps with `if:` rather than
      # one step splicing an expression into the command line, which is the
      # shape zizmor's template-injection audit exists to catch.
      #
      # ADR-015. Pull requests and pushes run a pair of steps:
      # 1. Everything except `wall_clock`, in parallel (`-n auto --dist
      #    worksteal`) and in pytest-randomly's shuffled order. `worksteal`
      #    rebalances as it goes, which matters because a few Bernoulli CUSUM
      #    tests dominate the suite's cost. `--cov-report=` (empty) writes no
      #    report yet, so no partial coverage.xml exists.
      # 2. The `wall_clock` tests -- the ones asserting elapsed time -- serially,
      #    with the runner to themselves, since parallel load can falsify a
      #    timing claim. `--cov-append` adds to step 1's data, so the
      #    coverage.xml Codecov reads covers both steps and matches a serial
      #    run line for line and branch for branch.
      # The nightly schedule and a manual dispatch run the full suite in one
      # serial step (ADR-015 Amendment 1, A2): the `slow` tests' budgets were
      # measured serially, and under four workers each heavy test runs
      # 1.6-2.6x longer, so a timeout there would mean "the runner was busy"
      # rather than "the library got slower". It is still shuffled.
      # `--durations=30` lists the slowest tests, so a hang guard running close
      # to its timeout is visible in the log.
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: uv run pytest -n auto --dist worksteal -m "not slow and not wall_clock" --cov-report= --durations=30
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: uv run pytest -m "wall_clock and not slow" --cov-append --cov-report=xml --durations=30
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run pytest --cov-report=xml --durations=30
      # Uploaded from one matrix leg only. All three run the same suite over
      # the same source, so three uploads would be three identical reports
      # racing to be the one Codecov reports on.
      #
      # Action version verified live 2026-09-15: codecov/codecov-action v7.1.0.
      - if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
