# Documentation build (BIN-86).
#
# ⚠️ **This workflow does not publish anything.** Read the Docs builds and
# hosts the site from `.readthedocs.yaml`, including a preview for every pull
# request, so the published docs do not depend on this job at all.
#
# It exists anyway, for two reasons worth stating so nobody deletes it as
# redundant:
#
#   * it is faster feedback, in the same check run as the other gates, rather
#     than on a separate service the reviewer has to go and look at;
#   * `mkdocs.yml` sets `strict: true`, so a broken link or an unresolvable
#     docstring reference is a build ERROR -- and the site is generated FROM
#     the docstrings, which makes a citation that stopped resolving a real
#     defect rather than a formatting nit.
#
# Read the Docs enforces the same thing via `mkdocs.fail_on_warning`, so the
# two agree by construction; this one just fails sooner.
name: Docs

on:
  # Manual trigger. The published site is built by Read the Docs, so this job
  # is a pre-merge gate rather than a deploy -- which makes it exactly the kind
  # of check worth running on demand after changing mkdocs.yml or a docstring,
  # without waiting for a push.
  workflow_dispatch:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `checkout` writes GITHUB_TOKEN into .git/config by default, where
          # any later step can read it (zizmor `artipacked`). Nothing in this
          # workflow pushes, so there is nothing to keep credentials for.
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group docs
      - run: uv run --group docs mkdocs build --strict
